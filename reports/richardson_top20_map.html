<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 20 Competitors — Richardson TX (75080)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1729; color: #e0e0e0; }
  #map { width: 100%; height: 100vh; }
  .leaflet-popup-content-wrapper { background: #16213e; color: #e0e0e0; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  .leaflet-popup-tip { background: #16213e; }
  .leaflet-popup-content { margin: 12px 16px; line-height: 1.5; }
  .popup-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .popup-row { font-size: 12px; display: flex; justify-content: space-between; gap: 12px; }
  .popup-label { color: #888; }
  .popup-value { font-weight: 600; }
  .popup-link { color: #74b9ff; text-decoration: none; font-size: 11px; }
  .popup-link:hover { text-decoration: underline; }
  .rank-num { display: inline-block; width: 22px; height: 22px; border-radius: 50%; text-align: center; line-height: 20px; font-size: 11px; font-weight: 700; color: #fff; margin-right: 4px; }
  .legend {
    position: absolute; bottom: 20px; left: 20px; z-index: 1000;
    background: rgba(15,23,41,0.95); padding: 14px 18px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4); font-size: 12px;
  }
  .legend h3 { font-size: 13px; margin-bottom: 8px; color: #fff; }
  .legend-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; }
  .title-card {
    position: absolute; top: 20px; left: 20px; z-index: 1000;
    background: rgba(15,23,41,0.95); padding: 16px 22px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 360px;
  }
  .title-card h1 { font-size: 15px; color: #fff; margin-bottom: 4px; }
  .title-card p { font-size: 11px; color: #888; }
  .title-card .our-info { margin-top: 8px; padding-top: 8px; border-top: 1px solid #333; font-size: 12px; }
  .title-card .our-info strong { color: #e74c3c; }
</style>
</head>
<body>
<div id="map"></div>

<div class="title-card">
  <h1>🗺️ Top 20 Competitors — Richardson TX</h1>
  <p>280 listings scraped · Scored against #1 ($46/night Shared room)</p>
  <p>Scrape date: Aug 12, 2026 · 10km radius</p>
  <div class="our-info">
    <strong>● Our Property:</strong> Shared room · $46/night<br>
    <span style="color:#888">32.9949, -96.7474 (Richardson)</span>
  </div>
</div>

<div class="legend">
  <h3>Competitor Score</h3>
  <div class="legend-row"><div class="legend-dot" style="background:#e74c3c"></div> Our Property</div>
  <div class="legend-row"><div class="legend-dot" style="background:#2ecc71"></div> Top 5 (60+)</div>
  <div class="legend-row"><div class="legend-dot" style="background:#f1c40f"></div> Rank 6–14 (52–59)</div>
  <div class="legend-row"><div class="legend-dot" style="background:#e67e22"></div> Rank 15–20 (&lt;52)</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const OUR = { lat: 32.9949, lng: -96.74742, title: "Shared room", price: 46, url: "https://www.airbnb.com/rooms/1609998115491103363" };

const COMPETITORS = [
  {rank:1,score:71.1,title:"1108 Private room E Near UTD | Pool | Pa",price:90,type:"Room",lat:32.9951,lng:-96.7424,url:"https://www.airbnb.com/rooms/1722628726838157093",rating:null,reviews:0},
  {rank:2,score:66.1,title:"Cozy private bath & bed - quiet, central",price:89,type:"Room",lat:33.00973,lng:-96.75276,url:"https://www.airbnb.com/rooms/546416136970961223",rating:4.90,reviews:91},
  {rank:3,score:63.2,title:"Modern 4BR House + Pool Rent Upstairs",price:48,type:"Room",lat:32.97385,lng:-96.73982,url:"https://www.airbnb.com/rooms/1534247361734382289",rating:3.67,reviews:3},
  {rank:4,score:62.6,title:"Spacious 4-BR Home w/ Pool Master bedroom",price:62,type:"Room",lat:32.97208,lng:-96.74174,url:"https://www.airbnb.com/rooms/1535842029047998080",rating:null,reviews:0},
  {rank:5,score:62.6,title:"Spacious 4-BR Home w/ Pool Master bedroom",price:62,type:"Room",lat:32.97208,lng:-96.74174,url:"https://www.airbnb.com/rooms/1535842029047998080",rating:null,reviews:0},
  {rank:6,score:57.2,title:"King Suite Near Champions School",price:271,type:"Apartment",lat:32.99743,lng:-96.76129,url:"https://www.airbnb.com/rooms/1666721502413652213",rating:null,reviews:0},
  {rank:7,score:57.1,title:"Modern North Dallas Suite | Serene",price:171,type:"Room",lat:32.97444,lng:-96.78232,url:"https://www.airbnb.com/rooms/20887054",rating:4.67,reviews:6},
  {rank:8,score:56.8,title:"Near Downtown Plano! Pets, Parking, Pool",price:106,type:"Room",lat:32.9795,lng:-96.7081,url:"https://www.airbnb.com/rooms/1602419293474689547",rating:4.67,reviews:3},
  {rank:9,score:56.6,title:"D-Queen & twin bed w/private bath",price:91,type:"Room",lat:33.0277,lng:-96.7675,url:"https://www.airbnb.com/rooms/29390053",rating:4.64,reviews:45},
  {rank:10,score:55.2,title:"G-Queen bed w/private bath in Plano",price:99,type:"Room",lat:33.0311,lng:-96.7678,url:"https://www.airbnb.com/rooms/35971358",rating:4.64,reviews:69},
  {rank:11,score:55.0,title:"2nd Bedroom with shared bath",price:63,type:"Room",lat:32.95773,lng:-96.7666,url:"https://www.airbnb.com/rooms/15755977",rating:4.89,reviews:315},
  {rank:12,score:52.1,title:"Your Stay In the Heart Of Plano",price:54,type:"Room",lat:33.0222,lng:-96.7931,url:"https://www.airbnb.com/rooms/1693915882938426223",rating:4.00,reviews:37},
  {rank:13,score:52.1,title:"Your Stay In the Heart Of Plano",price:54,type:"Room",lat:33.0222,lng:-96.7931,url:"https://www.airbnb.com/rooms/1693915882938426223",rating:4.00,reviews:37},
  {rank:14,score:52.1,title:"In The Heart Of Plano | Pool. Free Parking",price:62,type:"Room",lat:33.0222,lng:-96.7931,url:"https://www.airbnb.com/rooms/1693186509882092385",rating:3.93,reviews:46},
  {rank:15,score:49.9,title:"The Longhorn House, King bed FREE Wi-Fi",price:470,type:"Home",lat:32.96692,lng:-96.75281,url:"https://www.airbnb.com/rooms/53181926",rating:4.75,reviews:194},
  {rank:16,score:49.9,title:"The Longhorn House, King bed FREE Wi-Fi",price:470,type:"Home",lat:32.96692,lng:-96.75281,url:"https://www.airbnb.com/rooms/53181926",rating:4.75,reviews:194},
  {rank:17,score:49.5,title:"Townhome Retreat - Private Room",price:226,type:"Room",lat:32.94808,lng:-96.71836,url:"https://www.airbnb.com/rooms/798035845225823486",rating:null,reviews:0},
  {rank:18,score:49.4,title:"~Luxury~ Apt in North Dallas!",price:177,type:"Apartment",lat:32.98138,lng:-96.71635,url:"https://www.airbnb.com/rooms/1521162141195796455",rating:4.96,reviews:28},
  {rank:19,score:49.0,title:"Comfort and peaceful stay",price:96,type:"Room",lat:32.94175,lng:-96.75784,url:"https://www.airbnb.com/rooms/918396657324534729",rating:4.88,reviews:17},
  {rank:20,score:48.9,title:"*Prime Richardson Stay + Restaurant & Pool",price:85,type:"Hotel",lat:32.97548,lng:-96.71935,url:"https://www.airbnb.com/rooms/1691374489125853564",rating:null,reviews:0},
];

const map = L.map('map').setView([OUR.lat, OUR.lng], 12);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles © Esri — Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom', maxZoom: 19
}).addTo(map);

// Jitter overlapping markers
const offsets = {};
COMPETITORS.forEach(c => {
  const key = `${c.lat.toFixed(4)},${c.lng.toFixed(4)}`;
  if (!offsets[key]) offsets[key] = [];
  offsets[key].push(c);
});

function markerColor(score) {
  if (score >= 60) return '#2ecc71';
  if (score >= 52) return '#f1c40f';
  return '#e67e22';
}

function buildPopup(c, isOurs) {
  if (isOurs) {
    return `<div class="popup-title">🏠 OUR PROPERTY</div>
      <div class="popup-row"><span class="popup-label">Type</span><span class="popup-value">Shared room</span></div>
      <div class="popup-row"><span class="popup-label">Price</span><span class="popup-value">$46/night</span></div>
      <div class="popup-row"><span class="popup-label">Location</span><span class="popup-value">Richardson, TX</span></div>
      <div style="margin-top:8px"><a class="popup-link" href="${c.url}" target="_blank">View on Airbnb ↗</a></div>`;
  }
  const ratingStr = c.rating ? `⭐${c.rating} (${c.reviews})` : 'No reviews';
  return `<div class="popup-title"><span class="rank-num" style="background:${markerColor(c.score)}">#${c.rank}</span> ${c.title}</div>
    <div class="popup-row"><span class="popup-label">Price</span><span class="popup-value">$${c.price}/night</span></div>
    <div class="popup-row"><span class="popup-label">Type</span><span class="popup-value">${c.type}</span></div>
    <div class="popup-row"><span class="popup-label">Rating</span><span class="popup-value">${ratingStr}</span></div>
    <div class="popup-row"><span class="popup-label">Score</span><span class="popup-value" style="color:${markerColor(c.score)}">${c.score}/100</span></div>
    <div style="margin-top:8px"><a class="popup-link" href="${c.url}" target="_blank">View on Airbnb ↗</a></div>`;
}

// Our property — big red pulsing marker
L.marker([OUR.lat, OUR.lng], {
  icon: L.divIcon({ className: '', html: `<div style="width:24px;height:24px;border-radius:50%;background:#e74c3c;border:3px solid #fff;box-shadow:0 0 0 4px rgba(231,76,60,0.3),0 2px 8px rgba(0,0,0,0.5)"></div>`, iconSize: [24,24], iconAnchor: [12,12], popupAnchor: [0,-16] }),
  zIndexOffset: 1000
}).bindPopup(buildPopup(OUR, true)).addTo(map);

// Competitor markers
COMPETITORS.forEach(c => {
  const key = `${c.lat.toFixed(4)},${c.lng.toFixed(4)}`;
  const cluster = offsets[key];
  let lat = c.lat, lng = c.lng;
  if (cluster.length > 1) {
    const idx = cluster.indexOf(c);
    const angle = (idx / cluster.length) * 2 * Math.PI;
    lat += Math.cos(angle) * 0.001;
    lng += Math.sin(angle) * 0.001;
  }
  const color = markerColor(c.score);
  L.marker([lat, lng], {
    icon: L.divIcon({ className: '', html: `<div style="width:20px;height:20px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#000">${c.rank}</div>`, iconSize: [20,20], iconAnchor: [10,10], popupAnchor: [0,-12] })
  }).bindPopup(buildPopup(c, false)).addTo(map);
});

// Radius circles
[1, 3, 5, 10].forEach(r => {
  L.circle([OUR.lat, OUR.lng], {
    radius: r * 1000, color: '#e74c3c', weight: 1, opacity: 0.3,
    fillColor: '#e74c3c', fillOpacity: 0.02, dashArray: '5, 8'
  }).addTo(map);
});

// Fit bounds
const allCoords = [OUR, ...COMPETITORS].map(l => [l.lat, l.lng]);
map.fitBounds(L.latLngBounds(allCoords).pad(0.15));
</script>
</body>
</html>
