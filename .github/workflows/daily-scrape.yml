name: Daily Airbnb scrape

# Server-free scheduling: GitHub runners are always awake (unlike the WSL box).
# All times UTC. 13:17 = 8:17 AM CDT (primary), 17:17 = 12:17 PM CDT
# (intraday refresh + missed-run safety — same-day re-stores replace, so
# double runs are idempotent by design).
on:
  schedule:
    - cron: "17 13 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/daily-scrape.yml']

# Never overlap runs; queue instead of cancel (data writes must not race)
concurrency:
  group: airbnb-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    # Pinned (not ubuntu-latest): this is an unattended pipeline — no surprise
    # OS migrations (ubuntu-latest → 26.0 was announced for 2026-10-19).
    # Bump deliberately, e.g. when planning 24.04 EOL (2029).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run market pipeline
        run: python main.py

      - name: Regenerate trend report + map
        run: python reports/trend_report.py

      - name: Commit results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.db reports/ logs/daily.log
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git pull --rebase --autostash origin main
            git commit -m "data: automated scrape $(date -u +%Y-%m-%d)"
            git push
          fi
